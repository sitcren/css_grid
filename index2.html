<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Usuário</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .pagina {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 70px 1fr 60px;
            grid-template-areas:
                "cabecalho cabecalho"
                "navegacao conteudo"
                "rodape rodape";
            min-height: 100vh;
        }

        header {
            grid-area: cabecalho;
            border: 2px solid #d63384;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        header a {
            margin-left: 25px;
            text-decoration: none;
            color: black;
        }

        nav {
            grid-area: navegacao;
            border: 2px solid #5cdb2e;
            padding: 20px;
        }

        nav a {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: black;
        }

        main {
            grid-area: conteudo;
            border: 2px solid #20a9bd;
            padding: 20px;
        }

        form {
            max-width: 600px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
        }

        footer {
            grid-area: rodape;
            border: 2px solid #405de6;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 600px) {
            .pagina {
                grid-template-columns: 1fr;
                grid-template-rows: 70px auto 1fr 60px;
                grid-template-areas:
                    "cabecalho"
                    "navegacao"
                    "conteudo"
                    "rodape";
            }

            header {
                padding: 0 15px;
            }

            header a {
                margin-left: 10px;
            }

            nav a {
                display: inline-block;
                margin-right: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="pagina">

        <!-- CABEÇALHO -->
        <header>

            <div class="logo">
                LOGO
            </div>

            <div>
                <a href="#">Home</a>
                <a href="#">Sobre</a>
                <a href="#">Contact</a>
            </div>

        </header>


        <!-- NAVEGAÇÃO -->
        <nav>

            <strong>NAVEGAÇÃO</strong>

            <a href="#">Início</a>
            <a href="#">Cadastro</a>
            <a href="#">Contacto</a>

        </nav>


        <!-- CONTEÚDO -->
        <main>

            <h2>Cadastro de Usuário</h2>

            <form>

                <label>Nome:</label>
                <input type="text">

                <label>Email:</label>
                <input type="email">

                <label>Password:</label>
                <input type="password">

                <label>Sexo:</label>
                <select>
                    <option>Masculino</option>
                    <option>Feminino</option>
                </select>

                <label>Endereço:</label>
                <input type="text">

                <label>Telefone:</label>
                <input type="tel">

                <label>Nacionalidade:</label>
                <input type="text">

                <label>Nível Académico:</label>
                <input type="text">

                <label>Profissão:</label>
                <input type="text">

                <button type="submit">Cadastrar</button>

            </form>

        </main>


        <!-- RODAPÉ -->
        <footer>
            © 2026 - Página de Cadastro | Todos os direitos reservados.
        </footer>

    </div>

</body>
</html>
